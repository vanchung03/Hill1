<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trái Tim Ánh Sáng ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #03050a;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .title {
            position: fixed;
            bottom: 25px;
            width: 100%;
            text-align: center;
            color: rgba(180, 220, 255, 0.6);
            font-size: 12px;
            letter-spacing: 5px;
            pointer-events: none;
        }
    </style>
</head>

<body>

<canvas id="canvas"></canvas>
<div class="title">A HEART MADE OF LIGHT</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width, height;
let particles = [];
let stars = [];

const TAU = Math.PI * 2;

// Kích thước màn hình
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createParticles();
    createStars();
}

// Công thức tạo hình trái tim
function heartPoint(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);

    const y = -(
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t)
    );

    return { x, y };
}

// Tạo các hạt sáng
function createParticles() {
    particles = [];

    const scale = Math.min(width / 39, height / 35) * 0.9;

    const count = Math.min(
        2600,
        Math.max(900, Math.floor(width * height / 390))
    );

    for (let i = 0; i < count; i++) {
        particles.push({
            t: Math.random() * TAU,

            spread: Math.random() < 0.78
                ? Math.sqrt(Math.random())
                : 0.94 + Math.random() * 0.09,

            size: Math.random() * 1.65 + 0.35,

            phase: Math.random() * TAU,

            speed: (Math.random() * 0.006 + 0.0015)
                * (Math.random() < 0.5 ? -1 : 1),

            alpha: Math.random() * 0.65 + 0.25,

            hue: 190 + Math.random() * 35,

            jitter: (Math.random() - 0.5) * 1.2,

            drift: Math.random() * 0.9 + 0.15
        });
    }
}

// Tạo các ngôi sao nền
function createStars() {
    stars = [];

    const count = Math.floor(width * height / 9000);

    for (let i = 0; i < count; i++) {
        stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 1.4 + 0.2,
            alpha: Math.random() * 0.45 + 0.08,
            phase: Math.random() * TAU
        });
    }
}

const start = performance.now();

// Vẽ và tạo chuyển động
function animate(now) {
    const time = (now - start) * 0.001;

    // Nền tối tạo hiệu ứng lưu ảnh
    ctx.fillStyle = "rgba(3, 5, 10, 0.23)";
    ctx.fillRect(0, 0, width, height);

    const centerX = width / 2;
    const centerY = height / 2 - 5;

    // Ánh sáng xanh phía sau trái tim
    const glow = ctx.createRadialGradient(
        centerX, centerY, 5,
        centerX, centerY, Math.min(width, height) * 0.38
    );

    glow.addColorStop(0, "rgba(27, 130, 210, 0.10)");
    glow.addColorStop(0.55, "rgba(22, 70, 140, 0.035)");
    glow.addColorStop(1, "rgba(0, 0, 0, 0)");

    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, width, height);

    // Sao lấp lánh
    for (const star of stars) {
        const twinkle = 0.5 + 0.5 *
            Math.sin(time * 1.5 + star.phase);

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(170, 215, 255, ${star.alpha * twinkle})`;

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            TAU
        );

        ctx.fill();
    }

    // Hiệu ứng trái tim đập
    const scale = Math.min(width / 39, height / 35) * 0.9;

    const pulse = 1 + Math.sin(time * 2) * 0.025;

    const sx = scale * pulse;
    const sy = scale * pulse;

    ctx.save();

    // Tăng độ sáng khi các hạt chồng lên nhau
    ctx.globalCompositeOperation = "lighter";

    // Các dòng năng lượng bên dưới trái tim
    for (let i = 0; i < 48; i++) {
        const t = Math.PI * (0.12 + 0.76 * i / 48);

        const point = heartPoint(t);

        const x = centerX + point.x * sx;
        const y = centerY + point.y * sy * 0.95;

        const length =
            (0.7 + 0.3 * Math.sin(i * 8.7))
            * 30 * sy * 0.23;

        ctx.beginPath();

        ctx.moveTo(x, y);

        ctx.bezierCurveTo(
            x + Math.sin(time + i) * 12,
            y + length * 0.35,

            x + Math.cos(time * 0.7 + i) * 18,
            y + length * 0.8,

            x + Math.sin(time * 0.8 + i * 2) * 24,
            y + length
        );

        ctx.strokeStyle =
            `rgba(90, 205, 255, ${0.12 + 0.12 * Math.sin(i)})`;

        ctx.lineWidth = 0.7 + (i % 3) * 0.35;

        ctx.stroke();
    }

    // Các hạt sáng tạo thành trái tim
    for (const p of particles) {
        p.t += p.speed;

        const point = heartPoint(p.t);

        const flutter =
            Math.sin(time * 2.2 + p.phase) * p.drift;

        const x = centerX + (
            point.x * p.spread
            + Math.sin(p.t * 3 + p.phase) * p.jitter
            + flutter * 0.24
        ) * sx;

        const y = centerY + (
            point.y * p.spread
            + Math.cos(p.t * 2 + p.phase) * p.jitter
        ) * sy;

        // Hạt sáng nhấp nháy
        const twinkle = 0.55 + 0.45 *
            Math.sin(time * 3 + p.phase);

        const alpha = Math.max(
            0.08,
            p.alpha * twinkle
        );

        const radius = p.size * (0.8 + twinkle * 0.5);

        ctx.beginPath();

        ctx.fillStyle =
            `hsla(${p.hue}, 100%, ${72 + twinkle * 18}%, ${alpha})`;

        ctx.shadowBlur = radius * 5;

        ctx.shadowColor =
            `hsla(${p.hue}, 100%, 72%, ${alpha})`;

        ctx.arc(x, y, radius, 0, TAU);

        ctx.fill();

        // Tia sáng lóe lên
        if (twinkle > 0.94 && p.size > 1.25) {
            ctx.beginPath();

            ctx.strokeStyle =
                `rgba(180, 235, 255, ${alpha * 0.7})`;

            ctx.lineWidth = 0.55;

            ctx.moveTo(x - 3, y);
            ctx.lineTo(x + 3, y);

            ctx.moveTo(x, y - 3);
            ctx.lineTo(x, y + 3);

            ctx.stroke();
        }
    }

    ctx.restore();

    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
}

// Tự điều chỉnh khi đổi kích thước màn hình
window.addEventListener("resize", resize);

// Khởi chạy
resize();

ctx.fillStyle = "#03050a";
ctx.fillRect(0, 0, width, height);

requestAnimationFrame(animate);
</script>

</body>
</html>
